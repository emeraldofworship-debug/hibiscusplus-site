[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
  "cd backend && python -m pip install --upgrade pip",
  "cd backend && pip install -r requirements.txt",
  "cd backend && pip install emergentintegrations --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/"
]

[start]
cmd = "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
